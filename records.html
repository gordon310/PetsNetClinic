<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>医生答卷记录 · 宠物线上问诊小程序</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --ok:#16a34a; --err:#dc2626; --warn:#d97706; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  .wrap { max-width:1080px; margin:0 auto; padding:24px 16px 60px; }
  header.page { background:linear-gradient(135deg,#0f172a,#2563eb); color:#fff; border-radius:16px; padding:22px 24px; margin-bottom:18px; }
  header.page h1 { margin:0 0 6px; font-size:20px; }
  header.page p { margin:0; opacity:.9; font-size:13px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .stat b { display:block; font-size:24px; }
  .stat span { color:var(--muted); font-size:12px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .toolbar input { flex:1; min-width:200px; padding:9px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; font-family:inherit; }
  button { border:1px solid var(--line); background:#fff; padding:9px 14px; border-radius:9px; font-size:14px; cursor:pointer; font-family:inherit; }
  button:hover { background:#f3f4f6; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px; }
  .card .top { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; }
  .card .who { font-weight:700; font-size:16px; }
  .card .meta { color:var(--muted); font-size:12.5px; }
  .card .meta a { color:var(--accent); text-decoration:none; }
  .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; background:#eef2ff; color:#3730a3; margin-left:6px; }
  .qa { margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; display:none; }
  .qa.open { display:block; }
  .qa .row { display:grid; grid-template-columns:minmax(220px,42%) 1fr; gap:8px; padding:5px 0; border-bottom:1px dotted #f0f1f3; }
  .qa .row .q { color:#374151; font-size:13px; }
  .qa .row .a { font-size:13.5px; }
  .qa .row .a ul { margin:0; padding-left:18px; }
  .muted { color:var(--muted); }
  .err { color:var(--err); }
  .toggle { margin-top:10px; display:flex; gap:8px; }
  button.del { color:var(--err); border-color:#fecaca; }
  button.del:hover { background:#fef2f2; }
  h2.sec { font-size:15px; margin:20px 0 10px; color:#111827; }
  table.sum { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  table.sum th, table.sum td { text-align:left; padding:9px 12px; font-size:13.5px; border-bottom:1px solid var(--line); }
  table.sum th { background:#f8fafc; color:var(--muted); font-weight:600; }
  table.sum tr:last-child td { border-bottom:none; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; }
  .pill.done { background:#dcfce7; color:#166534; }
  .pill.repeat { background:#fef9c3; color:#854d0e; }
  @media (max-width:600px){ .qa .row{ grid-template-columns:1fr; gap:2px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>医生答卷记录</h1>
    <p>数据来自 <span id="repoName"></span> 的 GitHub Issues（label: doctor-feedback）。仅供内部查看与导出。</p>
  </header>

  <div class="stats">
    <div class="stat"><b id="s-total">–</b><span>提交份数</span></div>
    <div class="stat"><b id="s-doctors">–</b><span>医生人数</span></div>
    <div class="stat"><b id="s-latest">–</b><span>最新提交</span></div>
  </div>

  <h2 class="sec">医生完成情况</h2>
  <div id="summary"></div>

  <h2 class="sec">答卷明细</h2>
  <div class="toolbar">
    <input id="search" type="search" placeholder="按医生姓名 / 医院过滤…" />
    <button id="btn-refresh">刷新</button>
    <button id="btn-csv">导出 CSV</button>
    <button id="btn-expand">展开全部</button>
  </div>

  <div id="list"></div>
  <p id="status" class="muted"></p>
</div>

<script>
const GITHUB_REPO = "gordon310/PetsNetClinic";

/* 中转服务地址：与 index.html 一致。配置后才能在线删除记录。
   例如 "https://petsnetclinic-relay.<子域>.workers.dev/" */
const RELAY_URL = "";

const QLABELS = {"1":"以下哪些情况适合先进行线上咨询？","2":"以下哪些情况建议直接到院？","3":"建议系统默认保存哪些宠物信息？","4":"当宠物生病时，以下哪些问题建议系统自动询问？","5":"是否希望系统根据客户描述自动进入不同问诊流程？","6":"以下哪些症状应该建立专门问诊流程？","7":"哪些情况建议客户上传照片？","8":"哪些情况建议客户上传视频？","9":"是否同意线上问诊采用三级风险分类？","10":"AI 是否可以自动整理客户描述，生成病情摘要？","11":"AI 是否可以根据当前信息继续自动追问？","12":"AI 发现危险症状时，是否可以直接提醒客户尽快到院？","13":"AI 是否可以在医生后台提供辅助判断？","14":"AI 是否可以直接告诉客户具体疾病名称？","15":"AI 是否可以直接推荐药物？","16":"AI 是否可以直接告诉客户用药剂量？","17":"医生打开一个线上病例时，希望首先看到哪些内容？","18":"医生是否需要直接在系统里继续向客户提问？","19":"医生结束一次线上问诊时，建议有哪些快捷选项？","20":"如果医生建议到院，系统是否应该直接提供预约？","21":"预约时是否需要选择以下内容？","22":"以下哪些内容建议长期保存在宠物档案中？","23":"医院目前是否有以下资料？","24":"是否同意把典型病例整理进入医院知识库？","25":"AI 整理出来的知识是否需要医生审核后才能正式进入知识库？","26":"线上问诊建议采用哪种模式？","27":"医生是否需要线上排班？","28":"客户提交问诊后，理想回复时间是：","29":"请选出您认为最重要的 5 项。","30":"最希望系统减少哪类工作？","31":"您认为线上问诊系统对于医院是否有实际价值？","32":"您是否愿意参与后续测试？","33":"如有特别重要的问题，可补充一句：","34":"哪些症状适合用 AI 图像 / 视频识别辅助？","35":"AI 影像 / 视频识别结果可以给谁看？","36":"AI 影像结论的表述上限？","37":"AI 影像 / 视频结果是否必须标注免责声明？","38":"影像拍摄质量与要求由谁定义？","39":"上传的影像是否留存并用于 AI 训练或知识库？","40":"触发「必须到院」或红色风险时，系统应如何提醒客户？","41":"客户是否必须先同意免责声明与知情同意才能开始问诊？","42":"AI 无法判断或信息不足时，系统的兜底方式？","43":"客户与 AI 的问诊交互形式？","44":"客户是否可以用语音描述症状？","45":"医生应在什么时机介入？","46":"医生不在线时如何处理新问诊？","47":"客户是否需要注册并绑定手机号才能问诊？","48":"是否支持一个账号下多宠物、家庭成员共享档案？","49":"客户收到医生回复的提醒方式？","50":"复诊提醒规则应由谁设定？","51":"线上病例是否需要与院内系统（HIS / 电子病历）打通？","52":"到院就诊后，结果是否需要回写到宠物健康档案？","53":"AI 辅助结论是否需要医生一键采纳 / 驳回并反馈（用于改进）？"};

document.getElementById("repoName").textContent = GITHUB_REPO;
let DATA = [];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function parseBody(body) {
  const info = {}; const answers = {}; let cur = null;
  (body || "").split("\n").forEach(raw => {
    const line = raw.replace(/\s+$/, "");
    if (!line) return;
    const m4 = line.match(/^[-*]\s*(医生姓名|填写日期|工号\s*\/\s*联系方式)[：:]\s*(.+)$/);
    if (m4) {
      const key = { "医生姓名": "doctor_name", "填写日期": "fill_date", "工号 / 联系方式": "doctor_contact" }[m4[1]];
      info[key] = m4[2].trim();
      return;
    }
    // 标题式：**1. 题干** 或 ### 1. 题干
    const mh = line.match(/^(?:\*\*|#{2,3}\s*)(\d+)\.\s/);
    if (mh) { cur = "q" + mh[1]; if (!answers[cur]) answers[cur] = []; return; }
    // 精简式：1. 作答（多选用 ；分隔）
    if (!/^[-*#>]/.test(line)) {
      const mq = line.match(/^(\d+)\.\s+(.+)$/);
      if (mq) {
        const k = "q" + mq[1]; const t = mq[2].trim();
        answers[k] = t.indexOf("；") >= 0 ? t.split("；") : t;
        return;
      }
    }
    if (cur) {
      const mc = line.match(/^\s*[-*]\s*\[(x| )\]\s*(.+)$/);
      if (mc) { if (mc[1].toLowerCase() === "x") answers[cur].push(mc[2].trim()); return; }
      const mb = line.match(/^\s*[-*]\s*(.+)$/);
      if (mb) { answers[cur].push(mb[1].trim()); return; }
      if (!/^(#|>|---|\*\*)/.test(line)) { answers[cur].push(line.trim()); return; }
    }
  });
  Object.keys(answers).forEach(k => {
    const arr = answers[k];
    if (Array.isArray(arr)) {
      if (arr.length === 1) answers[k] = arr[0];
      else if (arr.length === 0) delete answers[k];
    }
  });
  return { info, answers };
}

async function load() {
  const status = document.getElementById("status");
  status.className = "muted";
  status.textContent = "加载中…";
  try {
    const url = "https://api.github.com/repos/" + GITHUB_REPO + "/issues?state=all&per_page=100&sort=created&direction=desc";
    const res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });
    if (!res.ok) throw new Error("GitHub API " + res.status + (res.status === 403 ? "（可能触发未登录频率限制，稍后再试）" : ""));
    const issues = (await res.json()).filter(i => !i.pull_request);
    DATA = issues.map(it => ({ number: it.number, url: it.html_url, author: (it.user || {}).login || "", created: it.created_at, state: it.state, title: it.title, ...parseBody(it.body) }));
    render();
    status.textContent = "共 " + DATA.length + " 份（GitHub 未登录接口单次最多 100 份；更早的记录请用 Issues 页或导出脚本）。";
  } catch (e) {
    status.className = "err";
    status.textContent = "加载失败：" + e.message;
  }
}

function doctorKey(d) { return (d.info.doctor_name || d.author || "未署名").trim(); }

function renderSummary() {
  const groups = {};
  DATA.forEach(d => {
    const k = doctorKey(d);
    if (!groups[k]) groups[k] = { name: k, authors: new Set(), count: 0, latest: "" };
    const g = groups[k];
    g.count++;
    if (d.author) g.authors.add(d.author);
    if (d.created > g.latest) g.latest = d.created;
  });
  const rows = Object.values(groups).sort((a, b) => b.latest.localeCompare(a.latest));
  const el = document.getElementById("summary");
  if (!rows.length) { el.innerHTML = '<p class="muted">暂无提交。</p>'; return; }
  el.innerHTML = '<table class="sum"><thead><tr><th>医生</th><th>GitHub 账号</th><th>提交次数</th><th>最近提交</th><th>状态</th></tr></thead><tbody>' +
    rows.map(g => "<tr><td><b>" + esc(g.name) + "</b></td><td>" +
      "</td><td>" + esc(Array.from(g.authors).join(", ") || "–") + "</td><td>" + g.count + "</td><td>" +
      new Date(g.latest).toLocaleString("zh-CN", { hour12: false }) + "</td><td>" +
      (g.count > 1 ? '<span class="pill repeat">已更新 ' + g.count + " 次</span>" : '<span class="pill done">已完成</span>') +
      "</td></tr>").join("") + "</tbody></table>";
}

function render() {
  renderSummary();
  const q = document.getElementById("search").value.trim().toLowerCase();
  const list = document.getElementById("list");
  const rows = DATA.filter(d => {
    if (!q) return true;
    return doctorKey(d).toLowerCase().includes(q);
  });
  const doctors = new Set(DATA.map(doctorKey));
  document.getElementById("s-total").textContent = DATA.length;
  document.getElementById("s-doctors").textContent = doctors.size;
  document.getElementById("s-latest").textContent = DATA[0] ? new Date(DATA[0].created).toLocaleString("zh-CN", { hour12: false }) : "–";

  if (!rows.length) {
    list.innerHTML = '<p class="muted">' + (DATA.length ? "没有符合过滤条件的记录。" :
      "还没有医生提交。让医生打开填写页 https://" + "gordon310.github.io/PetsNetClinic/ 填完点「提交」后，这里就会出现记录。") + "</p>";
    return;
  }

  list.innerHTML = rows.map(d => {
    const qas = Object.keys(d.answers).sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1))).map(k => {
      const ans = d.answers[k];
      const html = Array.isArray(ans) ? "<ul>" + ans.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" : esc(ans);
      return '<div class="row"><div class="q">' + k.slice(1) + ". " + esc(QLABELS[k.slice(1)] || "") + '</div><div class="a">' + html + "</div></div>";
    }).join("");
    return '<div class="card">' +
      '<div class="top"><div><span class="who">' + esc(doctorKey(d)) + '</span>' +
      (d.state === "closed" ? '<span class="badge">已关闭</span>' : "") + "</div>" +
      '<div class="meta">填写日期 ' + esc(d.info.fill_date || "–") +
      " · GitHub @" + esc(d.author) + " · 提交 " + new Date(d.created).toLocaleString("zh-CN", { hour12: false }) +
      ' · <a href="' + d.url + '" target="_blank" rel="noopener">打开 Issue #' + d.number + "</a></div></div>" +
      '<div class="toggle"><button type="button" data-toggle="' + d.number + '">查看答卷</button>' +
      '<button type="button" class="del" data-del="' + d.number + '">' + (RELAY_URL ? "删除" : "去 GitHub 删除") + '</button></div>' +
      '<div class="qa" id="qa-' + d.number + '">' + qas + "</div>" +
      "</div>";
  }).join("");

  list.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const el = document.getElementById("qa-" + btn.dataset.toggle);
      el.classList.toggle("open");
      btn.textContent = el.classList.contains("open") ? "收起答卷" : "查看答卷";
    });
  });
  list.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", () => deleteRecord(Number(btn.dataset.del), btn));
  });
}

function setStatusText(msg) {
  const el = document.getElementById("status");
  el.className = "muted";
  el.textContent = msg;
}

async function deleteRecord(number, btn) {
  const rec = DATA.find(x => x.number === number);
  if (!RELAY_URL) {
    if (rec) window.open(rec.url, "_blank", "noopener");
    return;
  }
  if (!confirm("确定删除记录 #" + number + "？此操作不可恢复。")) return;
  const key = sessionStorage.getItem("pnc_admin_key") || prompt("请输入管理员口令：");
  if (!key) return;
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = "删除中…";
  try {
    const r = await fetch(RELAY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-key": key },
      body: JSON.stringify({ action: "delete", number: number }),
    });
    if (r.status === 401) { sessionStorage.removeItem("pnc_admin_key"); throw new Error("口令错误"); }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (!d.ok) throw new Error("删除失败");
    sessionStorage.setItem("pnc_admin_key", key);
    DATA = DATA.filter(x => x.number !== number);
    render();
    setStatusText("已删除记录 #" + number);
  } catch (e) {
    btn.disabled = false; btn.textContent = old;
    alert("删除失败：" + e.message);
  }
}

function toCSV() {
  const nums = Object.keys(QLABELS).sort((a, b) => a - b);
  const header = ["issue", "链接", "医生姓名", "填写日期", "GitHub账号", "提交时间", "状态"].concat(nums.map(n => n + "_" + QLABELS[n]));
  const escCsv = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const lines = [header.map(escCsv).join(",")];
  DATA.forEach(d => {
    const base = [d.number, d.url, doctorKey(d), d.info.fill_date || "", d.author, d.created, d.state];
    const ans = nums.map(n => { const v = d.answers["q" + n]; return Array.isArray(v) ? v.join("；") : (v || ""); });
    lines.push(base.concat(ans).map(escCsv).join(","));
  });
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "医生答卷_" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById("btn-refresh").addEventListener("click", load);
document.getElementById("btn-csv").addEventListener("click", toCSV);
document.getElementById("btn-expand").addEventListener("click", () => {
  const anyClosed = Array.from(document.querySelectorAll(".qa")).some(el => !el.classList.contains("open"));
  document.querySelectorAll(".qa").forEach(el => el.classList.toggle("open", anyClosed));
  document.querySelectorAll("[data-toggle]").forEach(b => b.textContent = anyClosed ? "收起答卷" : "查看答卷");
  document.getElementById("btn-expand").textContent = anyClosed ? "收起全部" : "展开全部";
});
document.getElementById("search").addEventListener("input", render);

load();
</script>
</body>
</html>
