name: 医生需求确认表 V0.2
description: 宠物线上问诊小程序 · 医生快速需求确认表（约 5–8 分钟）
title: "[医生答卷] "
labels: ["doctor-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        感谢填写《宠物线上问诊小程序 · 医生快速需求确认表 V0.2》。

        本表用于确认：① 什么可以线上问 ② 什么必须到医院 ③ AI 可以/不可以做什么 ④ 医生希望系统怎样提高效率。

        > 提交后请勿删除本 Issue —— 它会被用作需求留档与开发文档回填依据。
        > 标记「可多选」的题目可勾选多项；第 29 题请选 5 项，第 30 题最多选 3 项。

  - type: input
    id: doctor_name
    attributes:
      label: 医生姓名 / 昵称
      placeholder: 例：张医生
    validations:
      required: true

  - type: input
    id: clinic
    attributes:
      label: 所属医院 / 科室
      placeholder: 例：螃蟹树动物医院 内科
    validations:
      required: true

  - type: input
    id: fill_date
    attributes:
      label: 填写日期
      placeholder: 例：2026-09-27
    validations:
      required: true

  # ---------- 一、哪些问题适合先线上问诊 ----------
  - type: checkboxes
    id: q1
    attributes:
      label: "1. 以下哪些情况适合先进行线上咨询？（可多选）"
      options:
        - label: 呕吐
        - label: 腹泻
        - label: 食欲下降
        - label: 精神状态差
        - label: 皮肤红肿 / 掉毛 / 瘙痒
        - label: 眼睛异常
        - label: 耳朵异常
        - label: 咳嗽 / 打喷嚏
        - label: 跛行 / 走路异常
        - label: 轻微外伤
        - label: 排尿异常
        - label: 排便异常
        - label: 术后恢复咨询
        - label: 用药后情况咨询
        - label: 疫苗 / 驱虫咨询
        - label: 幼犬 / 幼猫健康咨询
        - label: 老年宠物健康咨询
        - label: 基本都可以先线上初步判断
    validations:
      required: true

  # ---------- 二、哪些情况应直接建议到院 ----------
  - type: checkboxes
    id: q2
    attributes:
      label: "2. 以下哪些情况建议直接到院？（可多选）"
      options:
        - label: 呼吸困难
        - label: 大量出血
        - label: 意识异常
        - label: 抽搐
        - label: 无法站立
        - label: 严重外伤
        - label: 疑似中毒
        - label: 持续频繁呕吐
        - label: 呕吐或排泄物带血
        - label: 长时间无法排尿
        - label: 明显腹部疼痛
        - label: 高热
        - label: 幼龄宠物精神状态极差
        - label: 误食异物
        - label: 其他严重异常
    validations:
      required: true

  # ---------- 三、基础资料 ----------
  - type: checkboxes
    id: q3
    attributes:
      label: "3. 建议系统默认保存哪些宠物信息？（可多选）"
      options:
        - label: 猫 / 狗
        - label: 品种
        - label: 年龄
        - label: 性别
        - label: 是否绝育
        - label: 体重
        - label: 疫苗情况
        - label: 驱虫情况
        - label: 既往病史
        - label: 正在服用的药物
        - label: 过敏史
        - label: 以上基本都需要
    validations:
      required: true

  # ---------- 四、AI 自动询问 ----------
  - type: checkboxes
    id: q4
    attributes:
      label: "4. 当宠物生病时，以下哪些问题建议系统自动询问？（可多选）"
      options:
        - label: 什么时候开始出现症状
        - label: 症状持续多久
        - label: 一天发生几次
        - label: 食欲情况
        - label: 饮水情况
        - label: 精神状态
        - label: 是否呕吐
        - label: 是否腹泻
        - label: 排尿情况
        - label: 排便情况
        - label: 是否疼痛
        - label: 是否可能误食
        - label: 是否有外伤
        - label: 最近是否换粮
        - label: 最近是否打疫苗
        - label: 最近是否驱虫
        - label: 基本都需要
    validations:
      required: true

  # ---------- 五、分症状追问 ----------
  - type: dropdown
    id: q5
    attributes:
      label: "5. 是否希望系统根据客户描述自动进入不同问诊流程？（单选）"
      description: 例：客户输入「狗狗一直吐」，系统自动进入「呕吐问诊」。
      options:
        - 非常需要
        - 可以有
        - 暂时不需要
    validations:
      required: true

  - type: checkboxes
    id: q6
    attributes:
      label: "6. 以下哪些症状应该建立专门问诊流程？（可多选）"
      options:
        - label: 呕吐
        - label: 腹泻
        - label: 皮肤问题
        - label: 眼睛问题
        - label: 耳朵问题
        - label: 呼吸 / 咳嗽
        - label: 排尿异常
        - label: 排便异常
        - label: 跛行
        - label: 外伤
        - label: 食欲下降
        - label: 精神异常
        - label: 误食 / 中毒
        - label: 术后恢复
    validations:
      required: true

  # ---------- 六、图片和视频 ----------
  - type: checkboxes
    id: q7
    attributes:
      label: "7. 哪些情况建议客户上传照片？（可多选）"
      options:
        - label: 皮肤问题
        - label: 眼睛
        - label: 耳朵
        - label: 牙齿
        - label: 外伤
        - label: 肿块
        - label: 呕吐物
        - label: 排泄物
        - label: 药品照片
        - label: 检查报告
    validations:
      required: true

  - type: checkboxes
    id: q8
    attributes:
      label: "8. 哪些情况建议客户上传视频？（可多选）"
      options:
        - label: 跛行 / 走路异常
        - label: 呼吸异常
        - label: 咳嗽
        - label: 抽搐
        - label: 异常行为
        - label: 精神状态异常
        - label: 疼痛反应
    validations:
      required: true

  # ---------- 七、风险分级 ----------
  - type: dropdown
    id: q9
    attributes:
      label: "9. 是否同意线上问诊采用三级风险分类？（单选）"
      description: |
        绿色：可先观察或进行一般健康建议；
        黄色：需要宠物医生进一步线上判断；
        红色：建议尽快到医院。
      options:
        - 同意
        - 基本同意，需要调整
        - 不建议这样分类
    validations:
      required: true

  # ---------- 八、AI 可以做什么 ----------
  - type: dropdown
    id: q10
    attributes:
      label: "10. AI 是否可以自动整理客户描述，生成病情摘要？（单选）"
      description: 例：「昨天开始没吃东西，今天吐了两次。」→ 症状开始=昨天；食欲下降；呕吐 2 次。
      options:
        - 可以
        - 不建议
    validations:
      required: true

  - type: dropdown
    id: q11
    attributes:
      label: "11. AI 是否可以根据当前信息继续自动追问？（单选）"
      options:
        - 可以
        - 可以，但需要医生设定规则
        - 不建议
    validations:
      required: true

  - type: dropdown
    id: q12
    attributes:
      label: "12. AI 发现危险症状时，是否可以直接提醒客户尽快到院？（单选）"
      options:
        - 可以
        - 必须经过医生确认
        - 不建议
    validations:
      required: true

  - type: dropdown
    id: q13
    attributes:
      label: "13. AI 是否可以在医生后台提供辅助判断？（单选）"
      description: 例：「建议重点确认是否存在误食、脱水等情况。」
      options:
        - 可以
        - 可以，仅供医生参考
        - 不建议
    validations:
      required: true

  # ---------- 九、AI 不能做什么 ----------
  - type: dropdown
    id: q14
    attributes:
      label: "14. AI 是否可以直接告诉客户具体疾病名称？（单选）"
      options:
        - 不可以，只能说「可能存在某类问题」
        - 可以提示可能性，但必须注明不能替代医生诊断
        - 可以直接给出初步诊断
    validations:
      required: true

  - type: dropdown
    id: q15
    attributes:
      label: "15. AI 是否可以直接推荐药物？（单选）"
      options:
        - 不可以
        - 只能介绍常规护理方法
        - 可以推荐非处方产品
        - 必须经过医生确认后才能推荐
    validations:
      required: true

  - type: dropdown
    id: q16
    attributes:
      label: "16. AI 是否可以直接告诉客户用药剂量？（单选）"
      options:
        - 不可以
        - 必须经过医生确认
        - 可以在已有医生处方基础上提醒
    validations:
      required: true

  # ---------- 十、医生接诊页面 ----------
  - type: checkboxes
    id: q17
    attributes:
      label: "17. 医生打开一个线上病例时，希望首先看到哪些内容？（可多选）"
      options:
        - label: 宠物基本资料
        - label: 本次主要症状
        - label: AI 病情摘要
        - label: 症状开始时间
        - label: 风险等级
        - label: 客户原始聊天记录
        - label: 图片
        - label: 视频
        - label: 历史疾病
        - label: 历史问诊记录
        - label: 历史用药记录
    validations:
      required: true

  - type: dropdown
    id: q18
    attributes:
      label: "18. 医生是否需要直接在系统里继续向客户提问？（单选）"
      options:
        - 必须需要
        - 最好有
        - 不需要
    validations:
      required: true

  # ---------- 十一、医生处理结果 ----------
  - type: checkboxes
    id: q19
    attributes:
      label: "19. 医生结束一次线上问诊时，建议有哪些快捷选项？（可多选）"
      options:
        - label: 暂时观察
        - label: 建议复诊
        - label: 建议尽快到院
        - label: 建议检查
        - label: 建议继续补充照片 / 视频
        - label: 提供护理建议
        - label: 提供用药建议
        - label: 转其他医生
        - label: 预约到院
    validations:
      required: true

  # ---------- 十二、到院转化 ----------
  - type: dropdown
    id: q20
    attributes:
      label: "20. 如果医生建议到院，系统是否应该直接提供预约？（单选）"
      options:
        - 是
        - 可以后续再做
        - 不需要
    validations:
      required: true

  - type: checkboxes
    id: q21
    attributes:
      label: "21. 预约时是否需要选择以下内容？（可多选）"
      options:
        - label: 到院时间
        - label: 医生
        - label: 科室
        - label: 检查项目
        - label: 不需要客户选择，由医院安排
    validations:
      required: true

  # ---------- 十三、宠物健康档案 ----------
  - type: checkboxes
    id: q22
    attributes:
      label: "22. 以下哪些内容建议长期保存在宠物档案中？（可多选）"
      options:
        - label: 基础资料
        - label: 疫苗记录
        - label: 驱虫记录
        - label: 既往疾病
        - label: 过敏史
        - label: 历史用药
        - label: 线上问诊记录
        - label: 到院就诊记录
        - label: 检查报告
        - label: X 光等影像
        - label: 手术记录
        - label: 住院记录
        - label: 体重变化
    validations:
      required: true

  # ---------- 十四、医院知识库 ----------
  - type: checkboxes
    id: q23
    attributes:
      label: "23. 医院目前是否有以下资料？（可多选）"
      options:
        - label: 常见疾病资料
        - label: 医生培训资料
        - label: 标准问诊流程
        - label: 标准诊疗流程
        - label: 客户宣教资料
        - label: 术后注意事项
        - label: 疫苗 / 驱虫资料
        - label: 典型病例
        - label: 历史病例
        - label: 目前资料比较零散
    validations:
      required: true

  - type: dropdown
    id: q24
    attributes:
      label: "24. 是否同意把典型病例整理进入医院知识库？（单选）"
      description: 内容：症状 → 问诊 → 检查 → 最终诊断 → 治疗结果
      options:
        - 同意
        - 同意，但需要脱敏
        - 暂不考虑
    validations:
      required: true

  - type: dropdown
    id: q25
    attributes:
      label: "25. AI 整理出来的知识是否需要医生审核后才能正式进入知识库？（单选）"
      options:
        - 必须审核
        - 重要内容审核
        - 不需要全部审核
    validations:
      required: true

  # ---------- 十五、线上问诊运营方式 ----------
  - type: dropdown
    id: q26
    attributes:
      label: "26. 线上问诊建议采用哪种模式？（单选）"
      options:
        - 全部免费
        - 前期免费
        - 普通咨询免费，医生问诊收费
        - 会员免费
        - 全部收费
        - 暂未确定
    validations:
      required: true

  - type: dropdown
    id: q27
    attributes:
      label: "27. 医生是否需要线上排班？（单选）"
      options:
        - 需要
        - 暂时不需要
        - 后期根据问诊量决定
    validations:
      required: true

  - type: dropdown
    id: q28
    attributes:
      label: "28. 客户提交问诊后，理想回复时间是：（单选）"
      options:
        - 10 分钟以内
        - 30 分钟以内
        - 1 小时以内
        - 2 小时以内
        - 当天回复即可
        - 按医生在线时间回复
    validations:
      required: true

  # ---------- 十六、第一阶段最重要的功能 ----------
  - type: checkboxes
    id: q29
    attributes:
      label: "29. 请选出您认为最重要的 5 项。（可多选，请选 5 项）"
      options:
        - label: AI 聊天式问诊
        - label: 自动追问
        - label: 图片上传
        - label: 视频上传
        - label: AI 病情摘要
        - label: 风险分级
        - label: 医生在线回复
        - label: 宠物健康档案
        - label: 历史病例查看
        - label: 到院预约
        - label: 医疗知识库
        - label: AI 医生助手
        - label: 复诊提醒
    validations:
      required: true

  # ---------- 十七、优先解决的工作 ----------
  - type: checkboxes
    id: q30
    attributes:
      label: "30. 最希望系统减少哪类工作？（可多选，最多 3 项）"
      options:
        - label: 重复回答相同问题
        - label: 反复询问基础资料
        - label: 客户描述不清楚
        - label: 客户发很多微信，需要人工整理
        - label: 判断哪些客户需要尽快到院
        - label: 查询历史病例
        - label: 术后回访
        - label: 预约沟通
        - label: 医疗知识查找
        - label: 暂时没有明显痛点
    validations:
      required: true

  # ---------- 十八、整体意见 ----------
  - type: dropdown
    id: q31
    attributes:
      label: "31. 您认为线上问诊系统对于医院是否有实际价值？（单选）"
      options:
        - 非常有价值
        - 有一定价值
        - 需要试运行后判断
        - 价值不大
    validations:
      required: true

  - type: dropdown
    id: q32
    attributes:
      label: "32. 您是否愿意参与后续测试？（单选）"
      options:
        - 愿意
        - 可以偶尔参与
        - 暂时不参与
    validations:
      required: true

  - type: textarea
    id: q33
    attributes:
      label: "33. 如有特别重要的问题，可补充一句："
      placeholder: 选填
    validations:
      required: false
